<h2 class="titre-centre" >Gestion Employés</h2>

<mat-card>
    <mat-card-header>
    <button  color="dark"  mat-button color="primary"  [routerLink]="['/addemploye']"  >
    <mat-icon  >create</mat-icon>
      Créer un employé</button>
    </mat-card-header>

<mat-card-content>

  <table mat-table  matSort  [dataSource]="datasource" class="mat-elevation-z8">

  <!-- Matricule colums-->
  <ng-container matColumnDef="matricule">
  <th mat-header-cell *matHeaderCellDef>Matricule</th>
  <td mat-cell *matCellDef="let element"> {{element.matricule}} </td>
  </ng-container>


  <!-- Nom Column -->
  <ng-container matColumnDef="nom">
    <th mat-header-cell *matHeaderCellDef  mat-sort-header > Nom</th>
    <td mat-cell *matCellDef="let element"> {{element.nom}} </td>
  </ng-container>

  <!-- Prenom Column -->
  <ng-container matColumnDef="prenom">
    <th mat-header-cell *matHeaderCellDef> Prénom </th>
    <td mat-cell *matCellDef="let element"> {{element.prenom}} </td>
  </ng-container>

 <!-- NSS Column -->
  <ng-container matColumnDef="nss">
    <th mat-header-cell *matHeaderCellDef> NSS </th>
    <td mat-cell *matCellDef="let element"> {{element.nss}} </td>
  </ng-container>


  <!-- Phone Column -->
  <ng-container matColumnDef="telephone">
    <th mat-header-cell *matHeaderCellDef> Téléphone </th>
    <td mat-cell *matCellDef="let element"> {{element.telephone}} </td>
  </ng-container>


    <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let element">
      <div class="actions-button">
      <button  mat-icon-button color="primary"  [routerLink]="['/addemploye']" (click)="onEdit(element)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="onDelete(element.id)">
      <mat-icon>delete</mat-icon>
      </button>
      <button mat-icon-button color="dark" (click)="onDelete(element.id)">
      <mat-icon>print</mat-icon>
      </button>
      
    </div>
    </td>
  </ng-container>


 

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<mat-paginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
  </mat-paginator>



</mat-card-content>


</mat-card>
