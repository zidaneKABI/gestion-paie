    <mat-card>
    <mat-card-header>
        <mat-card-title>Création d'un Employé</mat-card-title>
        </mat-card-header>
    <mat-card-content  >
     <form  [formGroup]="employeform"  (ngSubmit)="creationEmploye()" >
    
    
          
    <div class="container-form">
         
    <div>
          <mat-form-field class="full-width" appearance="outline">
          <mat-label>Structure ID</mat-label>
          <input matInput type="number" formControlName="structureId">
          </mat-form-field>
      
         <mat-form-field class="full-width" appearance="outline">
         <mat-label>Poste Travail ID</mat-label>
        <input matInput type="number" formControlName="postetravailId">
        </mat-form-field>

        </div>
        
      <div>
        <mat-form-field class="full-width" >
        <mat-label>Nom</mat-label>
        <input matInput formControlName="nom">
      </mat-form-field>

      <mat-form-field class="full-width" >
      <mat-label>Prénom</mat-label>
      <input matInput formControlName="prenom">
      </mat-form-field>
</div>
   

<div> 
<mat-form-field class="full-width" >
        <mat-label>NSS</mat-label>
        <input matInput type="text" formControlName="nss">
  </mat-form-field>
 
  
  <mat-form-field class="full-width" >
        <mat-label>Matricule</mat-label>
        <input matInput type="text" formControlName="matricule">
  </mat-form-field>
 </div>

 <div>
  <mat-label>Sexe</mat-label>
  <mat-radio-group formControlName="sexe" class="radio-group">
  <mat-radio-button value="Homme">Homme</mat-radio-button>
  <mat-radio-button value="Femme">Femme</mat-radio-button>
  </mat-radio-group>
  
 </div>

  <div> 
  <mat-form-field >
  <mat-label>Date de naissance</mat-label>
  <input matInput       [matDatepicker]="picker1" formControlName="datenaissance">
  <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
  <mat-datepicker #picker1></mat-datepicker>
  </mat-form-field>

  <mat-form-field >
  <mat-label>Date de recrutement</mat-label>
  <input matInput [matDatepicker]="picker2" formControlName="daterecrutement">
  <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
  <mat-datepicker #picker2></mat-datepicker>
  </mat-form-field>
       
  

</div> 

     
      <mat-form-field class="full-width" >
        <mat-label>Adresse</mat-label>
        <input matInput formControlName="adresse_1">
      </mat-form-field>
      <div> 
      <mat-form-field class="full-width" >
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email">
      </mat-form-field>
      
      <mat-form-field class="full-width" >
        <mat-label>Téléphone Mobile :</mat-label>
        <input matInput formControlName="telephone">
      </mat-form-field>
    </div>
     



      
     
    </div>
    
    <div>
    <button type="submit"   mat-raised-button >
         <mat-icon>save</mat-icon>
        Créer</button>
   
    </div>

    </form>
    </mat-card-content>
    </mat-card>
